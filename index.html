<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balitu Database</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1125;color:#c5c1dc;font:15px system-ui,sans-serif}</style>
</head>
<body>
<p id="m">Abrindo o Balitu Database…</p>
<script>
// Abre o site no PC; se o PC estiver desligado, vai para o Balitu Database na nuvem (balitudatabase.github.io).
var pcOnline = function(d){return new Promise(function(ok,no){var i=new Image(),t=setTimeout(function(){i.src='';no()},8000);i.onload=function(){clearTimeout(t);ok(d)};i.onerror=function(){clearTimeout(t);no()};i.src=d+'/logo-backup.svg?'+Date.now()})};
function primeiro(lista){return new Promise(function(ok,no){var falhas=0;lista.forEach(function(p){p.then(ok,function(){if(++falhas===lista.length)no()})})})}
fetch('destino.txt?' + Date.now(), {cache: 'no-store'})
  .then(function (r) { return r.text(); })
  .then(function (t) {
    var url = t.trim().replace(/\/+$/, '');
    // No proprio PC o endereco publico nao volta para a mesma maquina: usa o local.
    return primeiro([pcOnline(url), pcOnline('http://127.0.0.1:8793')]);
  })
  .then(function (url) { location.replace(url); })
  .catch(function () { location.replace('https://balitudatabase.github.io/'); });
</script>
</body>
</html>
